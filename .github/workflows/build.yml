name: Build 3DS CIA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Inspect preinstalled 3DS toolchain
        run: |
          echo "=== Compiler ==="
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          echo "=== 3DS startup and library files ==="
          find /opt/devkitpro -type f \( -name '3dsx_crt0.o' -o -name 'libctru.a' -o -name '3dsx.specs' -o -name '3ds_rules' \)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CIA packaging tools
        run: |
          mkdir -p /tmp/3ds-tools
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/3ds-tools/bannertool-src
          cmake -S /tmp/3ds-tools/bannertool-src -B /tmp/3ds-tools/bannertool-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-tools/bannertool-build --parallel 2
          install -m 755 /tmp/3ds-tools/bannertool-build/bannertool /usr/local/bin/bannertool
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/3ds-tools/project-ctr
          make -C /tmp/3ds-tools/project-ctr/makerom -j2
          install -m 755 /tmp/3ds-tools/project-ctr/makerom/bin/makerom /usr/local/bin/makerom
          command -v bannertool
          command -v makerom
          bannertool --help >/dev/null
          makerom --help >/dev/null

      - name: Build CIA
        run: make clean && make

      - name: Verify output
        run: test -s build/NSMBHD-Shop.cia

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMBHD-Shop
          path: build/NSMBHD-Shop.cia
          if-no-files-found: error

      - name: Publish latest CIA asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NSMBHD-Shop.cia
          fail_on_unmatched_files: true
          overwrite_files: true
