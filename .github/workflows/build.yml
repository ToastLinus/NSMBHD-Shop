name: Build 3DS CIA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Inspect preinstalled 3DS toolchain
        run: |
          echo "=== Compiler ==="
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          echo "=== 3DS startup and library files ==="
          find /opt/devkitpro -type f \( -name '3dsx_crt0.o' -o -name 'libctru.a' -o -name '3dsx.specs' -o -name '3ds_rules' \)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CIA packaging tools
        run: |
          mkdir -p /tmp/3ds-tools
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/3ds-tools/bannertool-src
          cmake -S /tmp/3ds-tools/bannertool-src -B /tmp/3ds-tools/bannertool-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-tools/bannertool-build --parallel 2
          install -m 755 /tmp/3ds-tools/bannertool-build/bannertool /usr/local/bin/bannertool
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/3ds-tools/project-ctr
          make -C /tmp/3ds-tools/project-ctr/makerom -j2
          install -m 755 /tmp/3ds-tools/project-ctr/makerom/bin/makerom /usr/local/bin/makerom
          command -v bannertool
          command -v makerom
          test -x /usr/local/bin/bannertool
          test -x /usr/local/bin/makerom

      - name: Clean previous build
        run: make clean

      - name: Generate Pokemon Hub icon and banner art
        run: |
          mkdir -p build
          python3 - <<'PY'
          import struct, zlib, wave, math

          def png(path, w, h, painter):
              pixels = [[(7, 15, 39, 255) for _ in range(w)] for _ in range(h)]
              def put(x, y, color):
                  if 0 <= x < w and 0 <= y < h:
                      pixels[y][x] = (*color, 255)
              def rect(x, y, rw, rh, color):
                  for yy in range(y, y + rh):
                      for xx in range(x, x + rw):
                          put(xx, yy, color)
              def circle(cx, cy, radius, color):
                  rr = radius * radius
                  for yy in range(cy - radius, cy + radius + 1):
                      for xx in range(cx - radius, cx + radius + 1):
                          if (xx-cx)**2 + (yy-cy)**2 <= rr:
                              put(xx, yy, color)
              for y in range(h):
                  for x in range(w):
                      t = x / max(1, w - 1)
                      put(x, y, (int(7 + 15*t), int(16 + 18*t), int(42 + 38*t)))
              painter(put, rect, circle, w, h)
              rows = []
              for row in pixels:
                  raw = bytearray([0])
                  for px in row:
                      raw.extend(px)
                  rows.append(bytes(raw))
              def chunk(kind, data):
                  return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              data = b"\x89PNG\r\n\x1a\n"
              data += chunk(b"IHDR", struct.pack(">2I5B", w, h, 8, 6, 0, 0, 0))
              data += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
              data += chunk(b"IEND", b"")
              open(path, "wb").write(data)

          def icon_art(put, rect, circle, w, h):
              circle(24, 24, 22, (34, 48, 74))
              circle(24, 23, 19, (248, 250, 255))
              for y in range(5, 24):
                  for x in range(5, 44):
                      if (x-24)**2 + (y-23)**2 <= 19**2:
                          put(x, y, (239, 67, 84))
              rect(6, 21, 36, 5, (20, 29, 48))
              circle(24, 23, 8, (255, 255, 255))
              circle(24, 23, 4, (43, 63, 91))
              circle(17, 13, 3, (255, 175, 177))

          def banner_art(put, rect, circle, w, h):
              for i in range(5):
                  circle(20 + i*16, 18 + (i%2)*88, 2+i%2, (45, 120+i*12, 166+i*8))
              rect(12, 12, 232, 3, (43, 192, 220))
              rect(12, 113, 232, 3, (43, 116, 166))
              circle(203, 65, 48, (20, 31, 53))
              circle(203, 64, 43, (247, 249, 255))
              for y in range(22, 65):
                  for x in range(160, 247):
                      if (x-203)**2 + (y-64)**2 <= 43**2:
                          put(x, y, (239, 67, 84))
              rect(161, 61, 84, 7, (20, 29, 48))
              circle(203, 64, 16, (255, 255, 255))
              circle(203, 64, 9, (43, 63, 91))
              circle(187, 43, 6, (255, 178, 180))

          png("build/icon.png", 48, 48, icon_art)
          png("build/banner.png", 256, 128, banner_art)

          with wave.open("build/banner.wav", "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(22050)
              samples = bytearray()
              for n in range(22050):
                  envelope = min(1.0, n / 500, (22050 - n) / 3000)
                  value = int(900 * envelope * math.sin(2 * math.pi * 660 * n / 22050))
                  samples.extend(struct.pack("<h", value))
              audio.writeframes(samples)
          PY

      - name: Build CIA
        run: make

      - name: Verify output
        run: test -s build/NSMBHD-Shop.cia

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMBHD-Shop
          path: build/NSMBHD-Shop.cia
          if-no-files-found: error

      - name: Publish latest CIA release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Pokemon Hub v0.1.0
          body: First illustrated Pokemon Hub build for Nintendo 3DS.
          files: build/NSMBHD-Shop.cia
          fail_on_unmatched_files: true
          overwrite_files: true
