name: Build 3DS CIA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Inspect preinstalled 3DS toolchain
        run: |
          echo "=== Compiler ==="
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          echo "=== 3DS startup and library files ==="
          find /opt/devkitpro -type f \( -name '3dsx_crt0.o' -o -name 'libctru.a' -o -name '3dsx.specs' -o -name '3ds_rules' \)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CIA packaging tools
        run: |
          mkdir -p /tmp/3ds-tools
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/3ds-tools/bannertool-src
          cmake -S /tmp/3ds-tools/bannertool-src -B /tmp/3ds-tools/bannertool-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-tools/bannertool-build --parallel 2
          install -m 755 /tmp/3ds-tools/bannertool-build/bannertool /usr/local/bin/bannertool
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/3ds-tools/project-ctr
          make -C /tmp/3ds-tools/project-ctr/makerom -j2
          install -m 755 /tmp/3ds-tools/project-ctr/makerom/bin/makerom /usr/local/bin/makerom
          command -v bannertool
          command -v makerom
          test -x /usr/local/bin/bannertool
          test -x /usr/local/bin/makerom

      - name: Clean previous build
        run: make clean

      - name: Generate 3DS icon
        run: |
          mkdir -p build
          python3 - <<'PY'
          import struct, zlib
          w = h = 48
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  # Dark navy tile with a bright cyan pixel-art speech bubble.
                  inside = 8 <= x <= 39 and 8 <= y <= 35
                  edge = inside and (x in (8, 39) or y in (8, 35))
                  tail = 27 <= x <= 36 and 32 <= y <= 41 and x >= y - 5
                  if edge or tail:
                      row.extend((34, 211, 238, 255))
                  elif inside:
                      row.extend((8, 24, 48, 255))
                  else:
                      row.extend((4, 12, 30, 255))
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">2I5B", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          open("build/icon.png", "wb").write(png)
          PY

      - name: Generate 3DS banner
        run: |
          python3 - <<'PY'
          import struct, zlib
          w, h = 256, 128
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  # Navy background with a cyan center panel.
                  panel = 12 <= x < 244 and 12 <= y < 116
                  edge = panel and (x < 16 or x >= 240 or y < 16 or y >= 112)
                  if edge:
                      row.extend((34, 211, 238, 255))
                  elif panel:
                      row.extend((8, 24, 48, 255))
                  else:
                      row.extend((4, 12, 30, 255))
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">2I5B", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          open("build/banner.png", "wb").write(png)
          import wave, math
          with wave.open("build/banner.wav", "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(22050)
              samples = bytearray()
              for n in range(22050):
                  envelope = min(1.0, n / 500, (22050 - n) / 3000)
                  value = int(900 * envelope * math.sin(2 * math.pi * 660 * n / 22050))
                  samples.extend(struct.pack("<h", value))
              audio.writeframes(samples)
          PY

      - name: Build CIA
        run: make

      - name: Verify output
        run: test -s build/NSMBHD-Shop.cia

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMBHD-Shop
          path: build/NSMBHD-Shop.cia
          if-no-files-found: error

      - name: Publish latest CIA asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NSMBHD-Shop.cia
          fail_on_unmatched_files: true
          overwrite_files: true
