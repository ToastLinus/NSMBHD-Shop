name: Build 3DS CIA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Inspect preinstalled 3DS toolchain
        run: |
          echo "=== Compiler ==="
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          echo "=== 3DS startup and library files ==="
          find /opt/devkitpro -type f \( -name '3dsx_crt0.o' -o -name 'libctru.a' -o -name '3dsx.specs' -o -name '3ds_rules' \)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CIA packaging tools
        run: |
          mkdir -p /tmp/3ds-tools
          curl -fL "https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.2/bannertool-1.2.2-linux.zip" -o /tmp/3ds-tools/bannertool.zip
          unzip -q /tmp/3ds-tools/bannertool.zip -d /tmp/3ds-tools/bannertool
          find /tmp/3ds-tools/bannertool -type f -name bannertool -exec install -m 755 {} /usr/local/bin/bannertool \;
          curl -fL "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip" -o /tmp/3ds-tools/makerom.zip
          unzip -q /tmp/3ds-tools/makerom.zip -d /tmp/3ds-tools/makerom
          find /tmp/3ds-tools/makerom -type f -name makerom -exec install -m 755 {} /usr/local/bin/makerom \;
          command -v bannertool
          command -v makerom
          bannertool --help >/dev/null
          makerom --help >/dev/null

      - name: Build CIA
        run: make clean && make

      - name: Verify output
        run: test -s build/NSMBHD-Shop.cia

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMBHD-Shop
          path: build/NSMBHD-Shop.cia
          if-no-files-found: error

      - name: Publish latest CIA asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NSMBHD-Shop.cia
          fail_on_unmatched_files: true
          overwrite_files: true
