name: Build 3DS CIA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CIA
        run: make

      - name: Verify output
        run: test -s build/NSMBHD-Shop.cia

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMBHD-Shop
          path: build/NSMBHD-Shop.cia
          if-no-files-found: error

      - name: Publish latest CIA asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NSMBHD-Shop.cia
          fail_on_unmatched_files: true
          overwrite_files: true
